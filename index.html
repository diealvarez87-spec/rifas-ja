<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas J.A. - Prueba Móvil</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --surface-card: #252525;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-green: #28a745;
            --whatsapp-green: #25d366;
            --accent-blue: #007bff;
            --accent-gold: #d4af37;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface-dark);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            color: #ffffff;
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        .stats-banner {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #ffffff;
        }

        .stats-banner b {
            color: var(--accent-gold);
        }

        .section-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
            color: #ffffff;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #161616;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-main);
        }

        .grid-wrapper {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 8px;
            background: #161616;
            margin-bottom: 12px;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .num-btn {
            padding: 10px 0;
            background: #2d2d2d;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-main);
        }

        .num-btn.selected {
            background: var(--accent-green);
            color: white;
        }

        .selection-card {
            background: #2c2516;
            border: 1px solid #5a4a1a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 12px;
            color: #ffd700;
        }

        .btn-whatsapp {
            display: block;
            width: 100%;
            background: var(--whatsapp-green);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .divider {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 25px 0;
        }

            padding: 15px;
