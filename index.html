<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas J.A.</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffcc00;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-height: 250px;
            overflow-y: auto;
            background: #252525;
            padding: 10px;
            border-radius: 5px;
        }
        .btn-num {
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-num.selected {
            background: #28a745;
        }
        .input-box, .btn-main {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: white;
            box-sizing: border-box;
        }
        .btn-main {
            background: #007bff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-whatsapp {
            background: #25d366;
        }

        /* --- PANEL DE ADMINISTRACIÓN AMPLIADO A PANTALLA COMPLETA --- */
        #adminModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .admin-content-large {
            background: #1e1e1e;
            width: 100%;
            max-width: 500px;
            height: 85vh;
            border-radius: 12px;
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .admin-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #333;
            background: #121212;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎟️ Rifas J.A.</h2>
    <p style="text-align: center;">Selecciona tu número de la suerte</p>

    <input type="text" id="buscador" class="input-box" placeholder="🔍 Buscar número..." onkeyup="filtrar()">

    <div class="grid" id="gridNumeros"></div>

    <p style="margin-top: 15px;">Seleccionado: <b id="lblSeleccionado" style="color: #ffcc00;">Ninguno</b></p>

    <a href="#" id="linkWsp" target="_blank">
        <button class="btn-main btn-whatsapp">Apartar por WhatsApp 📱</button>
    </a>

    <!-- Botón para abrir el panel de administración grande -->
    <button class="btn-main" style="background: #555; margin-top: 20px;" onclick="abrirAdmin()">🛠️ Panel de Administración</button>
</div>

<!-- MODAL DE ADMINISTRADOR GRANDE -->
<div id="adminModal">
    <div class="admin-content-large">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px;">
            <h3 style="margin: 0; color: #ffcc00;">🛠️ Panel de Administración</h3>
            <button onclick="cerrarAdmin()" style="background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer;">Cerrar ✕</button>
        </div>

        <input type="text" id="adminSearch" class="input-box" placeholder="🔍 Buscar cliente en admin..." onkeyup="filtrarAdmin()">

        <div class="admin-list" id="adminListContainer">
            <!-- Ejemplo de la lista que tenías -->
            <div style="background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <b>N° 1421</b> - Yelimar Partidas<br>
                    <small style="color: #aaa;">📞 04140663373</small>
                </div>
                <button style="background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold;">Ticket 🎫</button>
            </div>
            <div style="background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <b>N° 1442</b> - Yelimar Partidas<br>
                    <small style="color: #aaa;">📞 04140663373</small>
                </div>
                <button style="background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold;">Ticket 🎫</button>
            </div>
        </div>
    </div>
</div>

<script>
    let numeroSeleccionado = null;
    const grid = document.getElementById('gridNumeros');

    // Generar los 1500 boletos
    for (let i = 1; i <= 1500; i++) {
        let btn = document.createElement('button');
        btn.className = 'btn-num';
        btn.innerText = i;
        btn.onclick = function() {
            document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            numeroSeleccionado = i;
            document.getElementById('lblSeleccionado').innerText = i;
            actualizarWsp();
        };
        grid.appendChild(btn);
    }

    function filtrar() {
        let val = document.getElementById('buscador').value;
        let botones = grid.getElementsByClassName('btn-num');
        for (let b of botones) {
            b.style.display = b.innerText.includes(val) ? '' : 'none';
        }
    }

    function actualizarWsp() {
        let t = "584246737022";
        let msg = `Hola, quiero apartar el número ${numeroSeleccionado} para la rifa.`;
        document.getElementById('linkWsp').href = `https://wa.me/${t}?text=${encodeURIComponent(msg)}`;
    }

    function abrirAdmin() {
        document.getElementById('adminModal').style.display = 'flex';
    }

    function cerrarAdmin() {
        document.getElementById('adminModal').style.display = 'none';
    }

    function filtrarAdmin() {
        let val = document.getElementById('adminSearch').value.toLowerCase();
        let items = document.getElementById('adminListContainer').children;
        for (let item of items) {
            item.style.display = item.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
        }
    }
</script>

</body>
</html>
