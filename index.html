<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Limpia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .contenedor {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Todo listo para empezar</h1>
    </div>

</body>
</html>
