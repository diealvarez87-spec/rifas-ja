<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas J.A. - Gran Sorteo Exclusivo</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --badge-red: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 70px;
        }

        /* Cabecera Regalos y Título */
        .header-section {
            text-align: center;
            position: relative;
            padding-top: 10px;
        }

        .gift-box-left, .gift-box-right {
            position: absolute;
            top: 0;
            font-size: 28px;
        }
        .gift-box-left { left: 10px; }
        .gift-box-right { right: 10px; }

        .gran-sorteo-badge {
            background: linear-gradient(90deg, #1d4ed8, #2563eb, #3b82f6);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
            margin-bottom: 6px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(180deg, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Tarjeta de Progreso y Valor */
        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 1%;
            height: 100%;
            background: var(--accent-green);
            border-radius: 4px;
        }

        .ticket-value-box {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #93c5fd;
            letter-spacing: 0.3px;
        }

        /* Botones principales de modo (Manual vs Azar) */
        .mode-buttons-row {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .mode-btn.manual {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .mode-btn.azar {
            background: var(--card-bg);
            color: var(--text-muted);
        }

        .mode-btn.azar.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Contenedor del Buscador y Rangos */
        .interactive-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            font-size: 13px;
            box-sizing: border-box;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Pestañas de Rangos (0001 - 0500, etc.) */
        .ranges-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .range-tab {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }

        .range-tab.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Leyenda de estados */
        .status-legend {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 0;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot.available { background: var(--text-muted); }
        .dot.selected { background: var(--accent-blue); }
        .dot.sold { background: var(--badge-red); }

        .range-status-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Grid de Boletos Numéricos */
        .tickets-grid {
            max-height: 220px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .ticket-cell {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 0;
            text-align: center;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-muted);
        }

        .ticket-cell.selected {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Barra Inferior Flotante (Apartar) */
        .bottom-floating-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
        }

        .selection-summary {
            font-size: 12px;
            color: var(--text-muted);
        }

        .selection-summary b {
            display: block;
            font-size: 15px;
            color: var(--accent-green);
        }

        .apartar-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }

        .apartar-btn:hover {
            background: var(--accent-green-hover);
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Cabecera exacta con regalos -->
    <div class="header-section">
        <div class="gift-box-left">🎁</div>
        <div class="gift-box-right">🎁</div>
        <div class="gran-sorteo-badge">✨ Gran Sorteo Exclusivo ✨</div>
        <h1 class="main-title">Rifas J.A.</h1>
        <div class="subtitle">¡Elige tus números de la suerte y gana!</div>
    </div>

    <!-- Progreso del Sorteo y Valor -->
    <div class="progress-card">
        <div class="progress-info">
            <span>🔥 Progreso del Sorteo (1500 Boletos)</span>
            <span style="color: var(--accent-green);">1%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
        <div class="ticket-value-box">
            Valor del boleto: 4.000 Bs
        </div>
    </div>

    <!-- Botones de Modo -->
    <div class="mode-buttons-row">
        <button id="btnManual" class="mode-btn manual" onclick="cambiarModo('manual')">
            <span>👉</span> Elegir Manual
        </button>
        <button id="btnAzar" class="mode-btn azar" onclick="cambiarModo('azar')">
            <span>🎲</span> Elegir al Azar
        </button>
    </div>

    <!-- Panel Interactivo de Elección -->
    <div class="interactive-panel">
        <input type="text" class="search-input" placeholder="🔍 Buscar número (ej. 0145)..." onkeyup="filtrarNumero(this.value)">
        
        <div class="ranges-row">
            <div id="range1" class="range-tab active" onclick="seleccionarRango(1, 500)">0001 - 0500</div>
            <div id="range2" class="range-tab" onclick="seleccionarRango(501, 1000)">0501 - 1000</div>
            <div id="range3" class="range-tab" onclick="seleccionarRango(1001, 1500)">1001 - 1500</div>
        </div>

        <div class="status-legend">
            <div class="legend-item"><span class="dot available"></span> Disponible</div>
            <div class="legend-item"><span class="dot selected"></span> Seleccionado</div>
            <div class="legend-item"><span class="dot sold"></span> Vendido</div>
        </div>

        <div class="range-status-info">
            <span id="textoMostrando">Mostrando: 0001 al 0500</span>
            <span>1500 activos</span>
        </div>

        <!-- Grid de Números -->
        <div class="tickets-grid" id="gridBoletos">
            <!-- Generado dinámicamente -->
        </div>
    </div>

</div>

<!-- Barra Inferior Flotante -->
<div class="bottom-floating-bar">
    <div class="selection-summary">
        <span id="cantSeleccionados">1 seleccionados</span>
        <b id="totalPrecio">Total: 4.000 Bs</b>
    </div>
    <button class="apartar-btn" onclick="enviarWhatsApp()">Apartar</button>
</div>

<!-- Script de Funcionalidad Exacta -->
<script>
    let inicioRango = 1;
    let finRango = 500;
    let seleccionados = ["0011"]; // Inicializado con el 0011 como en tu captura
    let precioBoleto = 4000;

    function generarBoletos(inicio, fin) {
        let grid = document.getElementById('gridBoletos');
        grid.innerHTML = '';
        for (let i = inicio; i <= fin; i++) {
            let numStr = String(i).padStart(4, '0');
            let cell = document.createElement('div');
            cell.className = 'ticket-cell';
            cell.innerText = numStr;
            
            if (seleccionados.includes(numStr)) {
                cell.classList.add('selected');
            }

            cell.onclick = function() {
                if (seleccionados.includes(numStr)) {
                    seleccionados = seleccionados.filter(n => n !== numStr);
                    cell.classList.remove('selected');
                } else {
                    seleccionados.push(numStr);
                    cell.classList.add('selected');
                }
                actualizarResumen();
            };
            grid.appendChild(cell);
        }
    }

    function seleccionarRango(inicio, fin) {
        inicioRango = inicio;
        finRango = fin;
        document.querySelectorAll('.range-tab').forEach(t => t.classList.remove('active'));
        if(inicio === 1) document.getElementById('range1').classList.add('active');
        if(inicio === 501) document.getElementById('range2').classList.add('active');
        if(inicio === 1001) document.getElementById('range3').classList.add('active');

        document.getElementById('textoMostrando').innerText = `Mostrando: ${String(inicio).padStart(4, '0')} al ${String(fin).padStart(4, '0')}`;
        generarBoletos(inicio, fin);
    }

    function actualizarResumen() {
        let cantidad = seleccionados.length;
        let total = cantidad * precioBoleto;
        document.getElementById('cantSeleccionados').innerText = `${cantidad} seleccionados`;
        document.getElementById('totalPrecio').innerText = `Total: ${total.toLocaleString()} Bs`;
    }

    function cambiarModo(modo) {
        if(modo === 'azar') {
            document.getElementById('btnAzar').classList.add('active');
            document.getElementById('btnManual').classList.remove('manual');
            document.getElementById('btnManual').style.background = 'var(--card-bg)';
            document.getElementById('btnManual').style.color = 'var(--text-muted)';
            
            // Selección aleatoria rápida
            let aleatorio = Math.floor(Math.random() * 1500) + 1;
            let strRand = String(aleatorio).padStart(4, '0');
            if(!seleccionados.includes(strRand)) seleccionados.push(strRand);
            generarBoletos(inicioRango, finRango);
            actualizarResumen();
        } else {
            document.getElementById('btnManual').classList.add('manual');
            document.getElementById('btnManual').style.background = '';
            document.getElementById('btnManual').style.color = '';
            document.getElementById('btnAzar').classList.remove('active');
        }
    }

    function filtrarNumero(query) {
        if(!query) {
            generarBoletos(inicioRango, finRango);
            return;
        }
        let grid = document.getElementById('gridBoletos');
        grid.innerHTML = '';
        for (let i = 1; i <= 1500; i++) {
            let numStr = String(i).padStart(4, '0');
            if (numStr.includes(query)) {
                let cell = document.createElement('div');
                cell.className = 'ticket-cell';
                cell.innerText = numStr;
                if (seleccionados.includes(numStr)) cell.classList.add('selected');
                cell.onclick = function() {
                    if (seleccionados.includes(numStr)) {
                        seleccionados = seleccionados.filter(n => n !== numStr);
                        cell.classList.remove('selected');
                    } else {
                        seleccionados.push(numStr);
                        cell.classList.add('selected');
                    }
                    actualizarResumen();
                };
                grid.appendChild(cell);
            }
        }
    }

    function enviarWhatsApp() {
        if(seleccionados.length === 0) {
            alert("Por favor selecciona al menos un boleto.");
            return;
        }
        let telefonoPapa = "584246737022";
        let total = seleccionados.length * precioBoleto;
        let mensaje = `Hola, quiero apartar los números de la rifa J.A.: ${seleccionados.join(', ')}. Total a pagar: ${total.toLocaleString()} Bs.`;
        window.open(`https://wa.me/${telefonoPapa}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    // Inicializar al cargar
    generarBoletos(1, 500);
    actualizarResumen();
</script>

</body>
</html>
